# CI/CD pipeline for the "examen" microservices app (gateway, users, orders)
#
# Architecture:
#   - test / build / run(integration) / push run UNTAGGED on GitLab.com's free
#     shared runners, using docker:dind. No dependency on the VM at all.
#   - deploy_* / stop_* are tagged `onprem` and only run on our self-hosted
#     shell-executor runner on the k3s VM, which has kubectl/helm installed.
#     They authenticate to the cluster from the $KUBE_CONFIG CI/CD variable
#     (type: File, contents = k3s's /etc/rancher/k3s/k3s.yaml) rather than
#     relying on any kubeconfig already sitting on the VM's filesystem -
#     portable, and avoids cross-user (gitlab-runner vs ubuntu) permission
#     issues on the shell executor.
#
# Every pipeline, on every branch, walks through all 4 environments in
# order: deploy_dev -> deploy_qa -> deploy_staging run automatically;
# deploy_prod only ever appears (as a manual button) when on the main
# branch, per the exam's "production deploy is manual, main branch only"
# requirement. stop_* jobs (manual) tear an environment's release down.

variables:
  VM_IP: "34.250.208.164"
  NODEPORT_DEV: "30080"
  NODEPORT_QA: "30081"
  NODEPORT_STAGING: "30082"
  NODEPORT_PROD: "30083"
  HELM_CHART: "helm/examen"

stages:
  - test
  - build
  - run
  - push
  - deploy_dev
  - deploy_qa
  - deploy_staging
  - deploy_prod

test:
  stage: test
  image: python:3.7.7
  script:
    - set -e
    - for svc in gateway users orders; do
        echo "===== $svc =====";
        pip install --no-cache-dir -r "$svc/requirements.txt" -q;
        (cd "$svc" && flake8 --max-line-length=120 --exclude=tests . || true);
        python -m py_compile "$svc/main.py";
        if [ -d "$svc/tests" ]; then
          for t in "$svc"/tests/*.py; do
            b=$(basename "$t" .py);
            [ "$b" = "__init__" ] && continue;
            (cd "$svc" && python -m "tests.$b");
          done
        fi;
      done

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - for svc in gateway users orders; do
        docker build -t "$DOCKERHUB_USERNAME/$svc:$CI_COMMIT_SHORT_SHA" "./$svc";
      done

run:
  stage: run
  image: docker:latest
  services:
    - docker:dind
  script:
    - for svc in gateway users orders; do
        docker build -t "$DOCKERHUB_USERNAME/$svc:$CI_COMMIT_SHORT_SHA" "./$svc";
      done
    - docker network create examen-net
    - docker run -d --network examen-net --name users "$DOCKERHUB_USERNAME/users:$CI_COMMIT_SHORT_SHA"
    - docker run -d --network examen-net --name orders "$DOCKERHUB_USERNAME/orders:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - >
      docker run -d --network examen-net --name gateway
      -e USERS_SERVICE_URL=http://users:8000 -e ORDERS_SERVICE_URL=http://orders:8000
      "$DOCKERHUB_USERNAME/gateway:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - docker run --rm --network examen-net curlimages/curl:latest curl -sf http://gateway:8000/docs
    - echo "Integration check OK - gateway reaches users+orders"
  after_script:
    - docker rm -f gateway users orders 2>/dev/null || true

push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - for svc in gateway users orders; do
        docker build -t "$DOCKERHUB_USERNAME/$svc:$CI_COMMIT_SHORT_SHA" -t "$DOCKERHUB_USERNAME/$svc:latest" "./$svc";
        docker push "$DOCKERHUB_USERNAME/$svc:$CI_COMMIT_SHORT_SHA";
        docker push "$DOCKERHUB_USERNAME/$svc:latest";
      done

.kubeconfig_setup:
  script:
    - rm -Rf ~/.kube && mkdir ~/.kube
    - cat "$KUBE_CONFIG" > ~/.kube/config
    - export KUBECONFIG=~/.kube/config

.deploy: &deploy
  tags:
    - onprem
  script:
    - !reference [.kubeconfig_setup, script]
    - >
      helm upgrade --install examen "$HELM_CHART"
      --namespace "$NAMESPACE" --create-namespace
      -f "$HELM_CHART/values-$NAMESPACE.yaml"
      --set dockerhubUsername="$DOCKERHUB_USERNAME"
      --set imageTag="$CI_COMMIT_SHORT_SHA"
      --wait --timeout 2m
    - kubectl get deploy,pods,svc -n "$NAMESPACE"

.stop: &stop
  tags:
    - onprem
  when: manual
  script:
    - !reference [.kubeconfig_setup, script]
    - helm uninstall examen -n "$NAMESPACE" || true

deploy_dev:
  <<: *deploy
  stage: deploy_dev
  variables:
    NAMESPACE: dev
  environment:
    name: development
    url: "http://$VM_IP:$NODEPORT_DEV"
    on_stop: stop_dev

stop_dev:
  <<: *stop
  stage: deploy_dev
  variables:
    NAMESPACE: dev
  environment:
    name: development
    action: stop

deploy_qa:
  <<: *deploy
  stage: deploy_qa
  variables:
    NAMESPACE: qa
  environment:
    name: qa
    url: "http://$VM_IP:$NODEPORT_QA"
    on_stop: stop_qa

stop_qa:
  <<: *stop
  stage: deploy_qa
  variables:
    NAMESPACE: qa
  environment:
    name: qa
    action: stop

deploy_staging:
  <<: *deploy
  stage: deploy_staging
  variables:
    NAMESPACE: staging
  environment:
    name: staging
    url: "http://$VM_IP:$NODEPORT_STAGING"
    on_stop: stop_staging

stop_staging:
  <<: *stop
  stage: deploy_staging
  variables:
    NAMESPACE: staging
  environment:
    name: staging
    action: stop

deploy_prod:
  <<: *deploy
  stage: deploy_prod
  variables:
    NAMESPACE: prod
  environment:
    name: production
    url: "http://$VM_IP:$NODEPORT_PROD"
    on_stop: stop_prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

stop_prod:
  <<: *stop
  stage: deploy_prod
  variables:
    NAMESPACE: prod
  environment:
    name: production
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
